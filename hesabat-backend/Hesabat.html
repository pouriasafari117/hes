<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Sprout — Watch your money pile up</title>
<!-- ═══ PILE v8 — قاب سفید ۲۰px + گرادیان + اعداد فارسی ═══ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fredoka:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
/* زبان قبل از رندر تا فلش جهت نداشته باشیم */
try{
  // var l = localStorage.getItem('pile-lang') || ((navigator.language||'').toLowerCase().indexOf('fa')===0 ? 'fa' : 'en');
  var l = localStorage.getItem('pile-lang') || 'fa';
  document.documentElement.lang = l;
  document.documentElement.dir  = l==='fa' ? 'rtl' : 'ltr';
}catch(e){}
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --paper:  #F4F0E2;
    --cream:  #FBF7EA;
    --ink:    #14351F;
    --ink-2:  #3E5747;
    --green-deep: #1C6E31;
    --lime:   #C4F45F;
    --line:   rgba(20,53,31,.16);
    --font-ui:       'DM Sans', Tahoma, sans-serif;
    --font-display:  'Fredoka', 'DM Sans', sans-serif;
  }
  [dir="rtl"] {
    --font-ui:      'IBM Plex Sans Arabic', 'DM Sans', Tahoma, sans-serif;
    --font-display: 'IBM Plex Sans Arabic', 'Fredoka', sans-serif;
  }
  body {
    background: #fff;                     /* قاب سفید بیرونی */
    padding: 20px;                        /* ← پدینگ ۲۰ دور فرش */
    font-family: var(--font-ui);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  /* ── کادر فرش: همه‌چیز داخل همین قاب ── */
  .stage {
    position: relative;
    height: calc(100vh - 40px);           /* fallback */
    height: calc(100svh - 40px);
    min-height: 600px;
    border-radius: 26px;
    overflow: hidden;
    background: var(--paper);
    box-shadow: 0 24px 70px -34px rgba(20,53,31,.35), 0 0 0 1px var(--line);
  }
  #pile {
    position: absolute; inset: 0; z-index: 0;
    width: 100%; height: 100%; display: block;
    cursor: crosshair; touch-action: pan-y;
    opacity: 0; transition: opacity .8s ease .05s;
  }
  #pile.on { opacity: 1; }

  /* ── گرادیان سفید زیر متن: از سمتِ ستون متن شروع و توی فرش محو می‌شه ── */
  .veil {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(to right,
      rgba(251,247,234,.96) 0%,
      rgba(251,247,234,.90) 26%,
      rgba(251,247,234,.55) 44%,
      rgba(251,247,234,0)   64%);
  }
  [dir="rtl"] .veil {
    background: linear-gradient(to left,
      rgba(251,247,234,.96) 0%,
      rgba(251,247,234,.90) 26%,
      rgba(251,247,234,.55) 44%,
      rgba(251,247,234,0)   64%);
  }

  #pileDebug {
    position: absolute; z-index: 4;
    inset-inline-start: 14px; bottom: 14px;
    font: 600 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: rgba(20,53,31,.88); color: #D9F7C0;
    padding: 7px 11px; border-radius: 9px;
    opacity: 0; transform: translateY(8px);
    transition: opacity .35s, transform .35s;
    pointer-events: none;
  }
  #pileDebug.show { opacity: 1; transform: none; }
  #pileDebug.bad  { background: #8E2F2F; color: #FFE3E3; }

  .ui {
    position: absolute; inset: 0; z-index: 2;
    display: flex; flex-direction: column;
    padding: clamp(18px,3vh,32px) clamp(20px,4vw,56px);
    pointer-events: none;
  }
  .ui a, .ui button { pointer-events: auto; }

  .nav {
    display: flex; align-items: center; flex-wrap: wrap; row-gap: 8px;
    width: 100%;
    background: rgba(251,247,234,.82);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--line); border-radius: 22px;
    padding: 9px 14px;
    box-shadow: 0 14px 30px -18px rgba(20,53,31,.5);
  }
  .brand {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--font-display); font-weight: 600; font-size: 1.25rem;
    color: var(--ink); text-decoration: none;
  }
  .nav-links { display: flex; gap: clamp(14px,2.4vw,28px); margin-inline-start: auto; }
  .nav-links a { font-size: .93rem; font-weight: 500; color: var(--ink); opacity: .75; text-decoration: none; transition: opacity .18s; }
  .nav-links a:hover { opacity: 1; }
  .nav-actions { display: flex; align-items: center; gap: 8px; margin-inline-start: clamp(12px,2vw,22px); }

  /* سوییچ زبان اسلایدی */
  .lang-sw {
    direction: ltr;
    position: relative; display: inline-flex;
    background: rgba(20,53,31,.08);
    border: 1px solid var(--line);
    border-radius: 999px; padding: 3px;
  }
  .lang-knob {
    position: absolute; z-index: 0;
    top: 3px; bottom: 3px; left: 3px;
    width: calc(50% - 3px);
    background: var(--green-deep);
    border-radius: 999px;
    box-shadow: 0 4px 10px -3px rgba(20,60,30,.55);
    transition: transform .42s cubic-bezier(.3,1.45,.45,1);
  }
  .lang-sw.fa .lang-knob { transform: translateX(100%); }
  .lang-opt {
    position: relative; z-index: 1;
    width: 48px; border: 0; background: none; cursor: pointer;
    font-family: 'IBM Plex Sans Arabic', var(--font-ui);
    font-size: .84rem; font-weight: 700; line-height: 1;
    color: var(--ink); opacity: .65;
    padding: 9px 0; border-radius: 999px;
    transition: color .25s, opacity .25s;
  }
  .lang-opt.active { color: var(--cream); opacity: 1; }
  .lang-opt:focus-visible { outline: 2px solid var(--lime); outline-offset: -2px; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-ui); font-weight: 700; font-size: 1rem; line-height: 1;
    padding: 14px 24px; border-radius: 999px; text-decoration: none;
    border: 1.5px solid transparent; cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease, background .18s ease, border-color .18s ease;
  }
  .btn-solid { background: var(--green-deep); color: var(--cream); box-shadow: 0 12px 24px -12px rgba(20,60,30,.55); }
  .btn-solid:hover { background: #175D28; transform: translateY(-2px); }
  .btn-solid:active { transform: translateY(0) scale(.98); }
  .btn-ghost { border-color: rgba(20,53,31,.32); color: var(--ink); background: rgba(251,247,234,.6); }
  .btn-ghost:hover { border-color: var(--ink); transform: translateY(-2px); }
  .btn-sm { padding: 9px 16px; font-size: .88rem; }
  .btn-icon { padding: 9px 11px; }
  .btn svg { transition: transform .18s ease; }
  .btn-solid:hover svg { transform: translateX(3px); }
  [dir="rtl"] .btn-solid:hover svg { transform: translateX(-3px) scaleX(-1); }
  [dir="rtl"] .btn-solid svg { transform: scaleX(-1); }
  .btn:focus-visible { outline: 3px solid var(--lime); outline-offset: 2px; border-radius: 999px; }

  .snd .ic-off { display: none; }
  .snd.muted .ic-on { display: none; }
  .snd.muted .ic-off { display: block; }

  /* متن: بدون کارت — مستقیم روی گرادیان */
  .copy {
    max-width: 640px;
    margin-top: clamp(26px,6.5vh,80px);
  }

  @keyframes copyInFa { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }
  @keyframes copyInEn { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: none; } }
  .copy.slide-fa { animation: copyInFa .5s cubic-bezier(.22,.9,.28,1) both; }
  .copy.slide-en { animation: copyInEn .5s cubic-bezier(.22,.9,.28,1) both; }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: .76rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
    color: var(--green-deep);
  }
  [dir="rtl"] .eyebrow { letter-spacing: 0; font-size: .82rem; }
  h1 {
    font-family: var(--font-display); font-weight: 600;
    font-size: clamp(2.4rem, 5vw, 4.2rem); line-height: 1.06; letter-spacing: -.015em;
    margin: clamp(14px,2.2vh,24px) 0 clamp(12px,1.8vh,18px);
    color: var(--ink);
  }
  [dir="rtl"] h1 { line-height: 1.3; letter-spacing: 0; font-weight: 700; }
  .hl { position: relative; white-space: nowrap; color: var(--green-deep); }
  .squiggle { position: absolute; inset-inline-start: 1%; bottom: -.16em; width: 98%; height: .2em; color: #9CCB3C; overflow: visible; }
  .squiggle path { stroke-dasharray: 340; stroke-dashoffset: 340; animation: draw 1s ease .55s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .sub {
    font-size: clamp(1rem,1.3vw,1.16rem); line-height: 1.7;
    color: var(--ink-2); max-width: 46ch;
  }
  .ctas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: clamp(18px,3vh,28px); }

  .stats {
    display: flex; flex-wrap: wrap; align-items: center;
    margin-top: clamp(18px,3vh,28px); padding: 14px 0 0;
    background: none; border: 0; border-top: 1px solid var(--line);
    border-radius: 0; box-shadow: none;
    width: 100%;
  }
  .stats > div { padding: 3px clamp(14px,1.8vw,24px); }
  .stats > div:first-child { padding-inline-start: 0; }
  .stats > div:not(:first-child) { border-inline-start: 1px solid var(--line); }
  .stats dt { font-size: .72rem; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-2); }
  [dir="rtl"] .stats dt { letter-spacing: 0; }
  .stats dd {
    font-family: var(--font-display); font-weight: 600;
    font-size: clamp(1.25rem,1.8vw,1.6rem); margin-top: 5px;
    display: flex; align-items: center; gap: 8px;
    font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate;
  }
  .stats dd em { font-style: normal; font-size: .62em; color: var(--green-deep); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green-deep); position: relative; flex: none; }
  .dot::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid var(--green-deep); animation: pulse 1.9s ease-out infinite; }
  @keyframes pulse { 0% { transform: scale(.35); opacity: .8; } 75%,100% { transform: scale(1.2); opacity: 0; } }

  .hint {
    position: absolute; z-index: 3;
    inset-inline-end: clamp(16px,3vw,40px); bottom: clamp(16px,4vh,36px);
    display: inline-flex; align-items: center; gap: 9px;
    font-size: .87rem; font-weight: 500; color: var(--green-deep);
    background: rgba(251,247,234,.88); border: 1px solid var(--line); border-radius: 999px;
    padding: 11px 17px; pointer-events: none;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: opacity .6s ease, transform .6s ease;
    animation: hintFloat 3.4s ease-in-out infinite;
  }
  .hint.gone { opacity: 0; transform: translateY(10px); }
  @keyframes hintFloat { 0%,100% { translate: 0 0; } 50% { translate: 0 -5px; } }

  .toast {
    position: absolute; left: 50%; bottom: 20px; z-index: 9; transform: translateX(-50%);
    max-width: min(88%, 460px); text-align: center;
    background: var(--green-deep); color: var(--cream);
    padding: 13px 21px; border-radius: 14px; font-size: .92rem; font-weight: 500;
    box-shadow: 0 20px 44px -18px rgba(15,50,25,.6);
    animation: toastIn .35s cubic-bezier(.2,.9,.3,1.15) both;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(-50%) translateY(14px) scale(.96); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  @media (max-width: 760px) {
    body { padding: 12px; }               /* قاب باریک‌تر در موبایل */
    .stage { height: calc(100vh - 24px); height: calc(100svh - 24px); min-height: 560px; }
    .veil, [dir="rtl"] .veil {
      background: linear-gradient(to bottom,
        rgba(251,247,234,.96) 0%,
        rgba(251,247,234,.88) 34%,
        rgba(251,247,234,.45) 55%,
        rgba(251,247,234,0)   74%);
    }
    .nav-links { display: none; }
    .copy { max-width: 100%; margin-top: clamp(16px,4vh,38px); }
    h1 br { display: none; }
    .sub { font-size: .96rem; }
    .ctas .btn { padding: 12px 18px; font-size: .93rem; }
    .hint { font-size: .78rem; padding: 9px 13px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .squiggle path { animation: none; stroke-dashoffset: 0; }
    .hint, .dot::after, .toast { animation: none; }
    .copy.slide-fa, .copy.slide-en { animation: none; }
    .lang-knob { transition: none; }
  }
</style>
</head>
<body>

<!-- PILE v8 — اگه این کامنت رو توی view-source ندیدی، فایل قدیمیه -->
<div class="stage">
  <canvas id="pile" aria-hidden="true"></canvas>
  <div class="veil" aria-hidden="true"></div>

  <div class="ui">
    <header class="nav">
      <a class="brand" href="#" id="lnkBrand">
        <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="13.5" fill="#2E9E4C"/>
          <circle cx="16" cy="16" r="13.5" fill="none" stroke="#1C6E31" stroke-width="2.6"/>
          <circle cx="16" cy="16" r="9" fill="none" stroke="#BFE8A8" stroke-width="1.6" stroke-dasharray="3.4 2.6"/>
          <text x="16" y="20.6" text-anchor="middle" font-size="13.5" font-weight="600" font-family="Fredoka, sans-serif" fill="#EAF9D6">$</text>
        </svg>

      <nav class="nav-links" aria-label="Primary">

        </button>
        <a class="btn btn-ghost btn-sm" href="#" id="lnkLogin" data-i="login"></a>
        <a class="btn btn-solid btn-sm" href="#" id="lnkOpen" data-i="open"></a>
      </div>
    </header>

    <div class="copy" id="copy">
      <p class="eyebrow">
        <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 15V8.2" stroke="#1C6E31" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          <path d="M8 8.2C8 4.9 5.6 2.8 2.6 2.8c0 3.4 2.4 5.4 5.4 5.4Z" fill="#2E9E4C"/>
          <path d="M8 8.2c0-2.9 2.1-4.6 5.3-4.6 0 3.1-2.4 4.6-5.3 4.6Z" fill="#57C463"/>
        </svg>
        <span data-i="eyebrow"></span>
      </p>
      <h1 data-i="h1"></h1>
      <p class="sub" data-i="sub"></p>

        <a class="btn btn-solid" href="#" id="lnkCta">
          <span data-i="ctaPrimary"></span>
          <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2.5 8h10.2M9.2 4.4 12.8 8l-3.6 3.6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>

        <div><dt data-i="statApy"></dt><dd data-i="apyV"></dd></div>
        <div><dt data-i="statFee"></dt><dd data-i="feeV"></dd></div>

  <p class="hint" id="hint">
    <svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true">
      <path d="M3.5 1.8 13 9.3l-4.3.7 2 4.2-2.1 1-2-4.3-3.1 2.6Z" fill="currentColor"/>
    </svg>
    <span data-i="hint"></span>
  </p>

  <div id="pileDebug" aria-hidden="true"></div>
  <div id="toastHolder"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   اسکریپت ۱ — فرش اسکناس (مستقل) — بدون تغییر نسبت به v7
   ═══════════════════════════════════════════════════════════════ */
(function(){
'use strict';

var canvas = document.getElementById('pile');
if(!canvas){ console.error('[pile] بوم پیدا نشد'); return; }
var ctx = canvas.getContext('2d');
if(!ctx){ console.error('[pile] context 2d در دسترس نیست'); return; }

var BILL_W = 130, BILL_H = 66;
var REPEL_R = 120, PUSH = 2, SPRING = .05, DAMP = .80;

var DEFAULT_GREENS = ['#6EDE8A','#2DC653','#4AD66D','#70E000'];
var GREENS = DEFAULT_GREENS.slice();
var DENOMS = ['100','50','20','10'];

var FA_DENOMS = {'100':'۱۰۰','50':'۵۰','20':'۲۰','10':'۱۰'};
var faNums = (document.documentElement.lang === 'fa');
function denomFor(d){ return faNums ? (FA_DENOMS[d] || d) : d; }
function numFont(px){
  return faNums
    ? '700 '+px+'px "IBM Plex Sans Arabic", Tahoma, sans-serif'
    : '600 '+px+'px Fredoka, Tahoma, sans-serif';
}
document.addEventListener('pile:lang', function(e){
  var fa = !!(e.detail && e.detail.fa);
  if(fa === faNums) return;
  faNums = fa;
  buildSprites();
  for(var i=0;i<bills.length;i++){ var sp=sprites[bills[i].sk]; if(sp) bills[i].sp=sp; }
});

var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function rand(a,b){ return a + Math.random()*(b-a); }

var dbg = document.getElementById('pileDebug');
function dbgShow(msg, bad){
  if(!dbg) return;
  dbg.textContent = msg;
  dbg.classList.add('show');
  dbg.classList.toggle('bad', !!bad);
  if(!bad){ clearTimeout(dbgShow._t); dbgShow._t = setTimeout(function(){ dbg.classList.remove('show'); }, 2600); }
}

function sanitizePalette(){
  var ok = (Array.isArray(GREENS) ? GREENS : []).filter(function(c){
    return typeof c === 'string' && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(c);
  }).map(function(h){
    return h.length === 4 ? '#'+h[1]+h[1]+h[2]+h[2]+h[3]+h[3] : h;
  });
  GREENS = ok.length ? ok : DEFAULT_GREENS.slice();
  if(!Array.isArray(DENOMS) || !DENOMS.length) DENOMS = ['100'];
}

function rr(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);     c.arcTo(x,y,x+w,y,r);
  c.closePath();
}
function shade(hex, amt){
  var n = parseInt(hex.slice(1),16), t = amt<0?0:255, a = Math.abs(amt);
  var r = Math.round((n>>16)    + (t-(n>>16))    *a);
  var g = Math.round((n>>8&255) + (t-(n>>8&255))*a);
  var b = Math.round((n&255)    + (t-(n&255))    *a);
  return 'rgb('+r+','+g+','+b+')';
}

function makeSprite(color, shaded, dpr){
  var pad = 24, w = BILL_W+pad*2, h = BILL_H+pad*2;
  var s = document.createElement('canvas');
  s.width = Math.round(w*dpr); s.height = Math.round(h*dpr);
  var c = s.getContext('2d');
  c.scale(dpr,dpr); c.translate(w/2,h/2);

  var face=color, side=shade(color,-.22), line=shade(color,-.42),
      frame=shade(color,.45), seal=shade(color,-.30), ink='#F2FBE0',
      denom = denomFor(DENOMS[GREENS.indexOf(color)%DENOMS.length] || '100');
  var L=-BILL_W/2, Tt=-BILL_H/2;

  c.save();
  c.shadowColor='rgba(15,60,35,.28)'; c.shadowBlur=7*dpr;
  c.fillStyle=side; rr(c,L,Tt+6,BILL_W,BILL_H,9); c.fill();
  c.restore();

  c.fillStyle=side; rr(c,L,Tt+BILL_H*.085,BILL_W,BILL_H,9); c.fill();

  c.fillStyle=face; rr(c,L,Tt,BILL_W,BILL_H,9); c.fill();
  c.lineWidth=3; c.strokeStyle=line; c.stroke();

  c.lineWidth=1.8; c.strokeStyle=frame;
  rr(c,L+BILL_W*.07,Tt+BILL_H*.12,BILL_W*.86,BILL_H*.76,5); c.stroke();

  c.fillStyle=side;
  c.font=numFont(Math.round(BILL_H*.235));
  c.textAlign='left'; c.textBaseline='top';
  c.fillText(denom, L+BILL_W*.105, Tt+BILL_H*.15);
  c.save();
  c.translate(L+BILL_W*.895, Tt+BILL_H*.85); c.rotate(Math.PI);
  c.fillText(denom,0,0);
  c.restore();

  c.globalAlpha=.7; c.lineWidth=1.4; c.strokeStyle=side;
  rr(c,L+BILL_W*.705,Tt+BILL_H*.155,BILL_W*.135,BILL_H*.115,BILL_H*.05); c.stroke();
  rr(c,L+BILL_W*.16 ,Tt+BILL_H*.73 ,BILL_W*.135,BILL_H*.115,BILL_H*.05); c.stroke();
  c.globalAlpha=1;

  var cy=BILL_H*.01, cr=BILL_H*.30;
  c.fillStyle=seal;
  c.beginPath(); c.arc(0,cy,cr,0,7); c.fill();
  c.lineWidth=2.4; c.strokeStyle=line; c.stroke();
  c.setLineDash([3.5,3]); c.lineWidth=1.4;
  c.strokeStyle='rgba(255,255,255,.55)';
  c.beginPath(); c.arc(0,cy,cr*.72,0,7); c.stroke();
  c.setLineDash([]);
  c.fillStyle=ink;
  c.font=numFont(Math.round(BILL_H*.37));
  c.textAlign='center'; c.textBaseline='middle';
  c.fillText('$',0,cy+BILL_H*.02);

  if(shaded){
    c.globalCompositeOperation='source-atop';
    c.fillStyle='rgba(18,62,34,.18)';
    c.fillRect(-w/2,-h/2,w,h);
    c.globalCompositeOperation='source-over';
  }
  return {img:s, w:w, h:h};
}

var W=1, H=1, dpr=1, bills=[], sprites={}, ripples=[];
var mouse = {x:-1e4, y:-1e4};

function buildSprites(){
  sprites={};
  GREENS.forEach(function(g,i){
    sprites[i+'-1']=makeSprite(g,false,dpr);
    sprites[i+'-0']=makeSprite(g,true ,dpr);
  });
}

function makeBills(){
  bills=[];
  var sx=BILL_W*.66, sy=BILL_H*.55;
  var est=(W/sx+1)*(H/sy+2);
  if(est>1400){ var k=Math.sqrt(est/1400); sx*=k; sy*=k; }
  var cols=Math.ceil(W/sx)+1, rows=Math.ceil((H+180)/sy)+1;
  for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){
    var gi=(Math.random()*GREENS.length)|0;
    var sk=gi+'-'+(Math.random()<.55?'1':'0');
    var sp=sprites[sk] || sprites['0-1'] || sprites['0-0'];
    if(!sp) continue;
    bills.push({
      hx:c*sx+(r%2?sx/2:0)+rand(-16,16), hy:r*sy+rand(-12,12),
      ox:0,oy:0,vx:0,vy:0,
      rot:rand(-.55,.55), ph:rand(0,Math.PI*2),
      sk:sk, sp:sp
    });
  }
}

function applySize(rebuild){
  dpr=Math.min(window.devicePixelRatio||1,2);
  var rc=canvas.getBoundingClientRect();
  W=Math.max(1,Math.round(rc.width)); H=Math.max(1,Math.round(rc.height));
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  if(rebuild){ buildSprites(); makeBills(); }
}

var lastW=0, lastH=0, lastDpr=1, rzT=0;
window.addEventListener('resize', function(){
  clearTimeout(rzT);
  rzT=setTimeout(function(){
    var dprNow=Math.min(window.devicePixelRatio||1,2);
    var rc=canvas.getBoundingClientRect();
    var nw=Math.max(1,Math.round(rc.width)), nh=Math.max(1,Math.round(rc.height));
    var big = nw!==lastW || Math.abs(nh-lastH)>=160 || dprNow!==lastDpr;
    lastW=nw; lastH=nh; lastDpr=dprNow;
    applySize(big);
  },180);
});

function burst(x,y){
  ripples.push({x:x,y:y,t0:performance.now()});
  var R=REPEL_R*2.6, m=REDUCED?.4:1;
  for(var i=0;i<bills.length;i++){
    var b=bills[i];
    var dx=(b.hx+b.ox)-x, dy=(b.hy+b.oy)-y;
    var d2=dx*dx+dy*dy;
    if(d2>R*R||d2<1) continue;
    var d=Math.sqrt(d2), fo=1-d/R, imp=10*fo*fo*m;
    b.vx+=dx/d*imp; b.vy+=dy/d*imp;
  }
}

function drawFrame(t){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  var motion=REDUCED?0:1, pushMul=REDUCED?.6:1;
  var mx=mouse.x, my=mouse.y, R2=REPEL_R*REPEL_R;

  for(var i=0;i<bills.length;i++){
    var b=bills[i];
    if(!b.sp || !b.sp.img || !b.sp.img.width) continue;
    var x=b.hx+b.ox, y=b.hy+b.oy;

    var dx=x-mx, dy=y-my;
    var d2=dx*dx+dy*dy;
    if(d2<R2){
      var d=Math.sqrt(d2)||1;
      var f=(1-d/REPEL_R)*PUSH*pushMul;
      b.vx+=dx/d*f; b.vy+=dy/d*f;
    }
    b.vx-=b.ox*SPRING; b.vy-=b.oy*SPRING;
    b.vx*=DAMP; b.vy*=DAMP;
    b.ox+=b.vx; b.oy+=b.vy;

    var bob=Math.sin(t*.0012+b.ph)*2*motion;
    var rot=b.rot+b.ox*.004;
    var cos=Math.cos(rot), sin=Math.sin(rot);
    ctx.setTransform(dpr*cos,dpr*sin,-dpr*sin,dpr*cos,x*dpr,(y+bob)*dpr);
    ctx.drawImage(b.sp.img,-b.sp.w/2,-b.sp.h/2,b.sp.w,b.sp.h);
  }

  ctx.setTransform(dpr,0,0,dpr,0,0);
  var nowMs=performance.now();
  for(var j=ripples.length-1;j>=0;j--){
    var rp=ripples[j], age=(nowMs-rp.t0)/700;
    if(age>=1){ ripples.splice(j,1); continue; }
    var e=1-Math.pow(1-age,3), r=18+e*150;
    ctx.globalAlpha=.5*(1-age);
    ctx.lineWidth=3; ctx.strokeStyle='#FBF7EA';
    ctx.beginPath(); ctx.arc(rp.x,rp.y,r,0,7); ctx.stroke();
    ctx.globalAlpha=.22*(1-age);
    ctx.beginPath(); ctx.arc(rp.x,rp.y,r*.55,0,7); ctx.stroke();
  }
  ctx.globalAlpha=1;
}

function tick(t){
  try{ drawFrame(t); }
  catch(err){
    console.error('[pile] خطای رندر — خودترمیمی:', err);
    sanitizePalette();
    buildSprites(); makeBills();
  }
  requestAnimationFrame(tick);
}

function localXY(e){
  var r=canvas.getBoundingClientRect();
  return {x:e.clientX-r.left, y:e.clientY-r.top};
}
canvas.addEventListener('pointermove', function(e){
  var p=localXY(e); mouse.x=p.x; mouse.y=p.y;
}, {passive:true});
canvas.addEventListener('pointerleave', function(){ mouse.x=-1e4; mouse.y=-1e4; });
canvas.addEventListener('pointerdown', function(e){
  var p=localXY(e); mouse.x=p.x; mouse.y=p.y;
  burst(p.x,p.y);
});

try{
  sanitizePalette();
  applySize(true);
  lastW=W; lastH=H; lastDpr=dpr;
  canvas.classList.add('on');
  requestAnimationFrame(tick);
  console.log('%c💵 CARPET v8 READY — '+bills.length+' bills'+(faNums?' [اعداد فارسی]':''),
    'background:#1C6E31;color:#fff;font-weight:bold;padding:3px 10px;border-radius:5px');
  dbgShow('💵 '+bills.length+' ✓', false);
}catch(e){
  console.error('[pile] بوت شکست خورد:', e);
  dbgShow('💵 ERROR — F12', true);
}

var fontsDone=false;
function upgradeOnce(){
  if(fontsDone) return; fontsDone=true;
  try{
    buildSprites();
    for(var i=0;i<bills.length;i++){ var sp=sprites[bills[i].sk]; if(sp) bills[i].sp=sp; }
  }catch(e){}
}
if(document.fonts && document.fonts.load){
  document.fonts.load('600 24px Fredoka').then(upgradeOnce, function(){});
  document.fonts.load('700 24px "IBM Plex Sans Arabic"').then(upgradeOnce, function(){});
}
})();
</script>

<script>
/* ═══════════════════════════════════════════════════════════════
   اسکریپت ۲ — UI، زبان (اسلایدی)، صدای کشوی صندوق — بدون تغییر
   ═══════════════════════════════════════════════════════════════ */
(function(){
'use strict';

var SQUIG = '<svg class="squiggle" viewBox="0 0 200 20" preserveAspectRatio="none" aria-hidden="true">'
  + '<path d="M3 13C30 5 55 17 84 11c26-5 51 5 82-1 12-2.4 24-1 31 3" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/></svg>';

var T = {
  en: {
    title:'Sprout — Watch your money pile up',
    brand:'Sprout', navRates:'Rates', navHow:'How it works', navHelp:'Help',
    login:'Log in', open:'Open account',

  },
  fa: {

    login:'ورود', open:'افتتاح حساب',
    eyebrow:'پس‌انداز اسپروت · سود روزشمار',
    h1:'ببین پولتو<br><span class="hl">روی هم می‌چینه'+SQUIG+'</span>',
    sub:'خرده‌ی خریدها و واریز خودکارِ آخر ماه، با سود سالانه ۴٫۶۰٪. بدون کارمزد، بدون حداقل موجودی، بدون ریزه‌کاری — تو زندگی کن، پول خودش می‌چینه.',
    ctaPrimary:'رایگان شروع کن', ctaSecondary:'چطور کار می‌کنه؟',
    statApy:'سود سالانه', statFee:'کارمزد ماهانه', statSaved:'پس‌انداز این هفته',
    apyV:'۴٫۶۰<em>٪</em>', feeV:'$۰',
    hint:'ماوس رو بکش لای پول‌ها — کلیک کن تا کشوی صندوق جیرینگ بده!',
    toasts:{
      brand:'فقط دموئه — ولی فرش پول کاملاً واقعیه!',
      rates:'این صفحه تو این دمو وصل نیست.',
      how:'چطور کار می‌کنه؟ پول میاد تو، پول رو هم می‌چینه.',
      help:'هنوز راهنمایی نداریم — فرش که راهنما نمی‌خواد!',
      login:'ورود تو این دمو نیست — برو بیل‌ها رو هُل بده.',
      open:'افتتاح حساب هنوز وصل نیست — ولی کشوی صندوق رایگان باز می‌شه!',
      cta:'یه روز اینجا حساب باز می‌کنه. امروز فقط کشوی صندوق باز می‌شه — جیرینگ!'
    },
    sndOn:'قطع صدا', sndOff:'پخش صدا'
  }
};

var lang = document.documentElement.lang === 'fa' ? 'fa' : 'en';

function fmtMoney(n){ return '$' + n.toLocaleString(lang==='fa' ? 'fa-IR' : 'en-US'); }

function broadcastLang(){
  try{
    document.dispatchEvent(new CustomEvent('pile:lang', {detail:{fa: lang==='fa'}}));
  }catch(err){
    try{
      var ev = document.createEvent('CustomEvent');
      ev.initCustomEvent('pile:lang', false, false, {fa: lang==='fa'});
      document.dispatchEvent(ev);
    }catch(e2){}
  }
}

var langSw   = document.getElementById('langSw');
var langOpts = langSw ? Array.prototype.slice.call(langSw.querySelectorAll('.lang-opt')) : [];
var copyEl   = document.getElementById('copy');

function updateLangToggle(){
  if(!langSw) return;
  langSw.classList.toggle('fa', lang === 'fa');
  langOpts.forEach(function(o){
    var on = o.getAttribute('data-lang') === lang;
    o.classList.toggle('active', on);
    o.setAttribute('aria-pressed', String(on));
  });
}

function setLang(l, animate){
  lang = l;
  document.documentElement.lang = l;
  document.documentElement.dir  = l==='fa' ? 'rtl' : 'ltr';
  document.title = T[l].title;
  document.querySelectorAll('[data-i]').forEach(function(el){
    var v = T[l][el.getAttribute('data-i')];
    if(v != null) el.innerHTML = v;
  });
  updateLangToggle();
  updateSoundBtn();
  renderTicker();
  broadcastLang();
  try{ localStorage.setItem('pile-lang', l); }catch(e){}

  if(animate && copyEl){
    copyEl.classList.remove('slide-fa','slide-en');
    void copyEl.offsetWidth;
    copyEl.classList.add(l === 'fa' ? 'slide-fa' : 'slide-en');
  }
}

langOpts.forEach(function(o){
  o.addEventListener('click', function(){
    var target = o.getAttribute('data-lang');
    if(target !== lang) setLang(target, true);
  });
});

/* ── توست ── */
var toastHolder = document.getElementById('toastHolder');
function toast(msg){
  if(!toastHolder) return;
  toastHolder.innerHTML = '';
  var d = document.createElement('div');
  d.className = 'toast'; d.setAttribute('role','status'); d.textContent = msg;
  toastHolder.appendChild(d);
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ d.remove(); }, 3200);
}
function bindStub(id, msgKey){
  var el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('click', function(e){ e.preventDefault(); toast(T[lang].toasts[msgKey]); });
}

/* ─────────── صدای کشوی صندوق (جیرینگ) ─────────── */

var FX = {
  ctx:null, master:null, noise:null,
  muted:false, openState:false,
  _lastPos:null, _lastT:0, _travel:0, _lastPlay:0,

  unlock:function(){
    if(!this.ctx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : .8;
      this.master.connect(this.ctx.destination);
      var len = this.ctx.sampleRate|0;
      var buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      var d = buf.getChannelData(0);
      for(var i=0;i<len;i++) d[i] = Math.random()*2-1;
      this.noise = buf;
    }
    if(this.ctx.state === 'suspended') this.ctx.resume();
  },

  ok:function(){ return !this.muted && this.ctx && this.ctx.state === 'running'; },

  latch:function(t, vol){
    var o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type='square';
    o.frequency.value = 2000 + Math.random()*400;
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(.05*vol, t+.004);
    g.gain.exponentialRampToValueAtTime(.0001, t+.03);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t+.04);
  },

  chunk:function(t, vol){
    var o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(46, t+.09);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(.30*vol, t+.008);
    g.gain.exponentialRampToValueAtTime(.0001, t+.14);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t+.16);

    var s=this.ctx.createBufferSource(); s.buffer=this.noise;
    var f=this.ctx.createBiquadFilter(); f.type='lowpass';
    f.frequency.setValueAtTime(900, t);
    f.frequency.exponentialRampToValueAtTime(180, t+.08);
    var g2=this.ctx.createGain();
    g2.gain.setValueAtTime(.0001, t);
    g2.gain.exponentialRampToValueAtTime(.14*vol, t+.006);
    g2.gain.exponentialRampToValueAtTime(.0001, t+.09);
    s.connect(f); f.connect(g2); g2.connect(this.master);
    s.start(t, Math.random()*.5); s.stop(t+.1);
  },

  creak:function(t, vol, dur){
    var D = dur || .2;
    var s=this.ctx.createBufferSource();
    s.buffer=this.noise; s.loop=true;
    s.playbackRate.value = .8 + Math.random()*.4;
    var f=this.ctx.createBiquadFilter();
    f.type='bandpass'; f.Q.value=9;
    f.frequency.setValueAtTime(340+Math.random()*120, t);
    f.frequency.linearRampToValueAtTime(950,  t+D*.3);
    f.frequency.linearRampToValueAtTime(700,  t+D*.5);
    f.frequency.linearRampToValueAtTime(1250, t+D);
    var g=this.ctx.createGain();
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(.09*vol, t+.03);
    g.gain.setValueAtTime(.07*vol, t+D*.6);
    g.gain.exponentialRampToValueAtTime(.0001, t+D+.06);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t); s.stop(t+D+.08);
  },

  rattle:function(t, vol){
    var n = 5 + (Math.random()*3|0);
    for(var i=0;i<n;i++){
      var t2 = t + Math.random()*.1;
      var o=this.ctx.createOscillator(), g=this.ctx.createGain();
      o.type='triangle';
      o.frequency.value = 1500 + Math.random()*2900;
      var v = (.015 + Math.random()*.025) * vol;
      g.gain.setValueAtTime(.0001, t2);
      g.gain.exponentialRampToValueAtTime(v, t2+.004);
      g.gain.exponentialRampToValueAtTime(.0001, t2+.05+Math.random()*.06);
      o.connect(g); g.connect(this.master);
      o.start(t2); o.stop(t2+.12);
    }
  },

  open:function(){
    if(!this.ok()) return;
    var t = this.ctx.currentTime;
    this.latch(t, .9);
    this.chunk(t+.02, 1);
    this.creak(t+.06, 1, .2);
    this.rattle(t+.09, 1);
  },

  close:function(){
    if(!this.ok()) return;
    var t = this.ctx.currentTime;
    this.chunk(t, .85);
    this.creak(t+.03, .45, .13);
    this.rattle(t+.05, .55);
  },

  drawer:function(){
    this.openState = !this.openState;
    this.openState ? this.open() : this.close();
  },

  move:function(x, y){
    if(!this.ok()) return;
    var now = performance.now();
    if(this._lastPos){
      var dx=x-this._lastPos.x, dy=y-this._lastPos.y;
      var dist = Math.hypot(dx,dy);
      var dt = Math.max(now-this._lastT, 8);
      var speed = dist/dt;
      if(dist>2) this._travel += dist;
      if(this._travel > 120 && now-this._lastPlay > 320){
        this._travel = 0; this._lastPlay = now;
        this.creak(this.ctx.currentTime,
          Math.min(.7, Math.max(.18, (speed-.2)/2)), .13);
      }
    }
    this._lastPos = {x:x, y:y}; this._lastT = now;
  }
};

var btnSound = document.getElementById('btnSound');
function updateSoundBtn(){
  if(!btnSound) return;
  btnSound.classList.toggle('muted', FX.muted);
  btnSound.setAttribute('aria-pressed', String(FX.muted));
  var _sndLbl = FX.muted ? T[lang].sndOff : T[lang].sndOn;
  btnSound.title = _sndLbl;
  btnSound.setAttribute('aria-label', _sndLbl);
}
if(btnSound) btnSound.addEventListener('click', function(){
  FX.muted = !FX.muted;
  if(FX.master) FX.master.gain.value = FX.muted ? 0 : .8;
  if(!FX.muted){ FX.unlock(); FX.drawer(); }
  updateSoundBtn();
});

var pile = document.getElementById('pile');
if(pile){
  pile.addEventListener('pointermove', function(e){
    var r = pile.getBoundingClientRect();

var hint = document.getElementById('hint');
document.addEventListener('pointerdown', function(){ if(hint) hint.classList.add('gone'); }, {once:true});

var saved = 2847193;

bindStub('lnkBrand','brand');   bindStub('lnkRates','rates');
bindStub('lnkHow','how');       bindStub('lnkHow2','how');

['lnkLogin','lnkOpen','lnkCta'].forEach(function(id){var el=document.getElementById(id);if(el)el.addEventListener('click',function(e){e.preventDefault();location.href='Panel.html';});});

setLang(lang);

})();
