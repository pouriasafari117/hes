services:
  db:
    image: postgres:16-alpine
    container_name: hesabat-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hesabat            # کاربر مالک (اجرای اسکریپت‌ها)
      POSTGRES_PASSWORD: hesabat_pass
      POSTGRES_DB: hesabat
    ports:
      - "5432:5432"
    volumes:
      - hesabat_pgdata:/var/lib/postgresql/data
      # در اولین راه‌اندازی، اسکیمای اولیه به‌صورت خودکار اجرا می‌شود
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hesabat -d hesabat"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  hesabat_pgdata:
