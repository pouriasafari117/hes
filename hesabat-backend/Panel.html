<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F4F0E2">
<title>حساب‌ها — پنل مدیریت صندوق‌ها و مؤسسات مالی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fredoka:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="panel.css">
</head>
<body class="in-login">
<!-- ═══════════════════════════════════════════════════════════
     حساب‌ها — توسعه بر اساس PSD: صفحه ورود + پوسته پنل مدیریت
     ═══════════════════════════════════════════════════════════ -->
<div class="view active" id="view-login">
  <div class="login-wrap">
    <a href="Hesabat.html" class="login-back" id="lnkBackHome">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M12 5l7 7-7 7"/></svg>
      بازگشت به صفحه اصلی
    </a>
    <div class="login-card">
      <span class="lg-brand">
        <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="13.5" fill="#2E9E4C"/>
          <circle cx="16" cy="16" r="13.5" fill="none" stroke="#1C6E31" stroke-width="2.6"/>
          <circle cx="16" cy="16" r="9" fill="none" stroke="#BFE8A8" stroke-width="1.6" stroke-dasharray="3.4 2.6"/>
          <text x="16" y="20.6" text-anchor="middle" font-size="13.5" font-weight="600" font-family="IBM Plex Sans Arabic, Tahoma, sans-serif" fill="#EAF9D6">ح</text>
        </svg>
        حساب‌ها
      </span>
      <h2>ورود به پنل مدیریت</h2>
      <p class="login-sub">سامانه مدیریت صندوق‌ها و مؤسسات مالی</p>
      <div id="loginAlert"></div>
      <form id="loginForm" novalidate>
        <div class="fields" style="grid-template-columns:1fr">
          <div class="field">
            <label for="lgUser">نام کاربری / شماره موبایل <span class="req">*</span></label>
            <input type="text" id="lgUser" autocomplete="username" placeholder="مثلاً admin">
            <span class="err-msg" id="lgUserErr"></span>
          </div>
          <div class="field">
            <label for="lgPass">رمز عبور <span class="req">*</span></label>
            <div class="field-row" style="position:relative">
              <input type="password" id="lgPass" autocomplete="current-password" placeholder="••••••" style="padding-inline-end:44px">
              <button type="button" class="jd-btn" id="btnEye" aria-label="نمایش رمز" style="inset-inline-end:6px">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <span class="err-msg" id="lgPassErr"></span>
          </div>
          <div class="field-row" style="justify-content:space-between">
            <label class="chk"><input type="checkbox" id="lgRemember" checked> مرا به خاطر بسپار</label>
            <a href="#" id="lnkForgot" style="font-size:.83rem; font-weight:700; color:var(--green-deep); text-decoration:none">بازیابی رمز عبور</a>
          </div>
          <button class="btn btn-solid" id="btnLogin" type="submit" style="justify-content:center; width:100%">
            <span id="btnLoginTxt">ورود به سامانه</span>
          </button>
        </div>
      </form>
      <div class="login-hint">
        <b>حساب‌های نمایشی</b> (رمز همه: <code>1234</code>) — هر نقش، سطح دسترسی متفاوتی دارد:<br>
        <code>admin</code> مدیر · <code>operator</code> اپراتور · <code>accountant</code> حسابدار · <code>viewer</code> مشاهده‌گر
      </div>
    </div>
  </div>
</div>

<div class="view" id="view-app">
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sb-brand">
        <span class="sb-logo">
          <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="16" r="13.5" fill="#2E9E4C"/>
            <circle cx="16" cy="16" r="13.5" fill="none" stroke="#C4F45F" stroke-width="1.8"/>
            <circle cx="16" cy="16" r="9" fill="none" stroke="#BFE8A8" stroke-width="1.4" stroke-dasharray="3.4 2.6"/>
            <text x="16" y="20.6" text-anchor="middle" font-size="13.5" font-weight="600" font-family="IBM Plex Sans Arabic, Tahoma, sans-serif" fill="#EAF9D6">ح</text>
          </svg>
        </span>
        <span class="sb-tt"><b>حساب‌ها</b><span>سامانه مدیریت صندوق‌ها</span></span>
      </div>
      <nav class="sb-nav" id="sbNav" aria-label="منوی اصلی"></nav>
      <div class="sb-foot">
        <div class="sb-user" id="sbUser"></div>
        <div class="sb-btns">
          <button class="sb-mini" id="btnSbCollapse" data-tip="جمع/باز کردن منو">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6M4 4v16"/></svg><span>جمع‌کردن</span>
          </button>
          <button class="sb-mini" id="btnSbLogout" data-tip="خروج از سامانه">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-2M9 12h12M17 8l4 4-4 4"/></svg><span>خروج</span>
          </button>
        </div>
      </div>
    </aside>
    <div class="app-main">
      <header class="app-header">
        <button class="hamb icon-btn" id="btnHamb" aria-label="باز کردن منو">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="org-chip" id="orgChip" data-tip="مؤسسه فعال">
          <i class="org-dot"></i><span class="tx" id="orgName">—</span>
        </div>
        <div class="qsearch" id="qsearch">
          <svg class="qs-ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="text" id="qInput" placeholder="جستجوی سریع: عضو، وام، حساب…" autocomplete="off">
          <div class="qs-panel" id="qsPanel"></div>
        </div>
        <div class="hdr-actions">
          <div class="drop" id="notifDrop">
            <button class="icon-btn" id="btnNotif" aria-label="اعلان‌ها">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6Z"/><path d="M10 19a2.2 2.2 0 0 0 4 0"/></svg>
              <span class="pip hidden" id="notifPip"></span>
            </button>
            <div class="drop-panel wide" id="notifPanel"></div>
          </div>
          <div class="drop" id="profDrop">
            <button class="profile-chip" id="btnProfile">
              <span class="avatar sz-34" id="profAv">؟</span>
              <span class="pc-t"><b id="profName">—</b><span id="profRole">—</span></span>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="color:var(--ink-2)"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="drop-panel" id="profPanel"></div>
          </div>
        </div>
      </header>
      <main class="content" id="main" tabindex="-1"></main>
    </div>
  </div>
  <div class="sb-backdrop" id="sbBackdrop"></div>
</div>

<div id="modalRoot"></div>
<div id="gToast" aria-live="polite"></div>
<div id="printRoot" aria-hidden="true"></div>

<script src="panel.js"></script>
</body>
</html>
